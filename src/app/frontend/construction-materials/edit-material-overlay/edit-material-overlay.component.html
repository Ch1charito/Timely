@if (editingMaterial) {
<div class="overlay">
    <div class="overlay-content">
        <button class="overlay-close" (click)="onClose()">
            <span class="material-icons">close</span>
        </button>
        <h3 class="overlay-title">Edit Material</h3>
        <form #materialForm="ngForm" (ngSubmit)="saveEdit()">
            <div class="form-section">
                <div class="form-group">
                    <label class="form-label">Material</label>
                    <input class="form-input" type="text" name="name" required [(ngModel)]="editingMaterial.name"/>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Quantity</label>
                        <input class="form-input" type="number" name="quantity" min="0" required [(ngModel)]="editingMaterial.quantity"/>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Unit</label>
                        <input class="form-input" type="text" name="unit" [(ngModel)]="editingMaterial.unit"/>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">Category</label>
                    <input class="form-input" type="text" name="category" [(ngModel)]="editingMaterial.category"/>
                </div>
            </div>
            <div class="overlay-actions">
                <button class="btn-outline" type="button" (click)="onClose()">Cancel</button>
                <button class="btn-primary" type="submit">Save</button>
            </div>
        </form>
    </div>
</div>
}
