<section class="landing">
    <div class="landing-content">
        <div class="brand">
            <span class="material-icons brand-icon">watch_later</span>
            <h1>Timely</h1>
            <p>Construction workforce management made simple.</p>
        </div>

        <div class="login-card">
            <h2>Sign In</h2>

            @if (errorMessage) {
                <div class="error-banner">{{ errorMessage }}</div>
            }

            <div class="login-form">
                <div class="form-group">
                    <label class="form-label">Email</label>
                    <input class="form-input" type="email" placeholder="Enter your email" [(ngModel)]="email"/>
                </div>
                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input class="form-input" type="password" placeholder="Enter your password" [(ngModel)]="password"/>
                </div>
                <button class="btn-cta" (click)="onLogin()" [disabled]="isLoading">
                    @if (isLoading) {
                        <span>Signing in...</span>
                    } @else {
                        <span>Sign In</span>
                        <span class="material-icons">arrow_forward</span>
                    }
                </button>
            </div>

            <div class="divider">
                <span>or</span>
            </div>

            <button class="btn-guest" (click)="guestLogin()" [disabled]="isLoading">
                <span class="material-icons">person_outline</span>
                Continue as Guest
            </button>
        </div>

        <div class="features">
            <div class="feature">
                <span class="material-icons">schedule</span>
                <span>Time Tracking</span>
            </div>
            <div class="feature">
                <span class="material-icons">event_available</span>
                <span>Vacation Management</span>
            </div>
            <div class="feature">
                <span class="material-icons">inventory_2</span>
                <span>Material Inventory</span>
            </div>
            <div class="feature">
                <span class="material-icons">construction</span>
                <span>Tool Tracking</span>
            </div>
        </div>
    </div>
    <footer class="landing-footer">
        <button routerLink="/impressum">Impressum</button>
        <button routerLink="/privacy-policy">Privacy Policy</button>
    </footer>
</section>
